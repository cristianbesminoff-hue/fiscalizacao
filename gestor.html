<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Gestor - Relatório de Vistorias</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f1f5f9; color: #333; }
        header { background: #0f172a; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .container { padding: 20px; max-width: 1100px; margin: auto; }
        .card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        h2, h3 { color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-top: 0; }
        
        .grid-filtros { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 15px; }
        label { font-size: 12px; font-weight: bold; color: #475569; display: block; margin-bottom: 4px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        
        button { background: #2563eb; color: white; border: none; padding: 10px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        button.sair { background: #dc2626; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; color: #475569; }
        tr:hover { background: #f1f5f9; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; text-transform: uppercase; }
        .badge-aprovado { background: #dcfce7; color: #15803d; }
        .badge-reprovado { background: #fee2e2; color: #b91c1c; }
        .badge-modulo { background: #e0f2fe; color: #0369a1; }
        
        .hidden { display: none; }
        .detalhes-box { background: #f8fafc; padding: 10px; border: 1px solid #e2e8f0; border-radius: 4px; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- LOGIN GESTOR -->
    <div id="area-auth" class="container" style="max-width: 400px; margin-top: 60px;">
        <div class="card">
            <button style="background: #64748b; margin-bottom:15px; padding:6px 12px;" onclick="window.location.href='index.html'">← Voltar ao Início</button>
            <h2>Acesso Gestor</h2>
            <div id="erro-login" style="color:red; font-size:13px; margin-bottom:10px;"></div>
            <label>E-mail:</label>
            <input type="email" id="gestor-email" placeholder="gestor@empresa.com">
            <label style="margin-top:10px;">Senha:</label>
            <input type="password" id="gestor-senha" placeholder="••••••••">
            <button onclick="loginGestor()" style="width: 100%; margin-top: 15px;">Entrar no Painel</button>
        </div>
    </div>

    <!-- PAINEL PRINCIPAL -->
    <div id="area-painel" class="hidden">
        <header>
            <div>
                <span id="saudacao-gestor" style="font-weight: bold;">Painel do Gestor</span>
            </div>
            <button class="sair" onclick="sairGestor()">Sair</button>
        </header>

        <div class="container">
            <!-- FILTROS -->
            <div class="card">
                <h3>Filtrar Relatório de Vistorias</h3>
                <div class="grid-filtros">
                    <div>
                        <label>Módulo:</label>
                        <select id="filtro-modulo" onchange="aplicarFiltros()">
                            <option value="TODOS">Todos os Módulos</option>
                            <option value="CLIENTE">CLIENTE</option>
                            <option value="REDE">REDE</option>
                        </select>
                    </div>
                    <div>
                        <label>Situação:</label>
                        <select id="filtro-situacao" onchange="aplicarFiltros()">
                            <option value="TODOS">Todas</option>
                            <option value="APROVADO">APROVADO</option>
                            <option value="PENDENCIA-REFAZER">PENDÊNCIA</option>
                        </select>
                    </div>
                    <div>
                        <label>Buscar por Protocolo/Cidade:</label>
                        <input type="text" id="filtro-texto" onkeyup="aplicarFiltros()" placeholder="Ex: Canoas, 12345...">
                    </div>
                </div>
            </div>

            <!-- LISTAGEM -->
            <div class="card">
                <h3>Vistorias Recebidas (<span id="total-vistorias">0</span>)</h3>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Data/Hora</th>
                                <th>Módulo</th>
                                <th>Técnico Qualidade</th>
                                <th>Protocolo</th>
                                <th>Cidade/UF</th>
                                <th>Executor</th>
                                <th>Situação</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-vistorias">
                            <tr><td colspan="8">Carregando vistorias...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD5bbJ5g8jtWjI0-13dWFifgZxc3SK0-g",
            authDomain: "fiscalizar-ef7de.firebaseapp.com",
            projectId: "fiscalizar-ef7de",
            storageBucket: "fiscalizar-ef7de.firebasestorage.app",
            messagingSenderId: "392888202041",
            appId: "1:392888202041:web:d45e8ceadfed5bf200eee8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let dadosVistorias = [];

        window.loginGestor = function() {
            const email = document.getElementById('gestor-email').value.trim();
            const senha = document.getElementById('gestor-senha').value.trim();
            
            // Validação simples (Pode ajustar as credenciais conforme seu uso)
            if (email !== "" && senha !== "") {
                document.getElementById('area-auth').classList.add('hidden');
                document.getElementById('area-painel').classList.remove('hidden');
                carregarVistorias();
            } else {
                document.getElementById('erro-login').textContent = "Informe usuário e senha válidos.";
            }
        };

        window.sairGestor = function() {
            location.reload();
        };

        async function carregarVistorias() {
            const tbody = document.getElementById('tabela-vistorias');
            tbody.innerHTML = '<tr><td colspan="8">Carregando banco de dados...</td></tr>';

            try {
                const snap = await getDocs(collection(db, "fiscalizacoes_modulos"));
                dadosVistorias = [];
                snap.forEach(doc => {
                    dadosVistorias.push({ id: doc.id, ...doc.data() });
                });

                // Ordenar da mais recente para a mais antiga
                dadosVistorias.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

                aplicarFiltros();
            } catch (e) {
                console.error("Erro ao buscar relatórios:", e);
                tbody.innerHTML = '<tr><td colspan="8" style="color:red;">Erro ao carregar dados do Firebase.</td></tr>';
            }
        }

        window.aplicarFiltros = function() {
            const mod = document.getElementById('filtro-modulo').value;
            const sit = document.getElementById('filtro-situacao').value;
            const txt = document.getElementById('filtro-texto').value.toLowerCase().trim();

            let filtrados = dadosVistorias.filter(item => {
                const matchMod = mod === 'TODOS' || item.modulo === mod;
                const matchSit = sit === 'TODOS' || item.situacaoFinal === sit;
                const matchTxt = !txt || 
                    (item.protocolo && item.protocolo.toLowerCase().includes(txt)) || 
                    (item.cidade && item.cidade.toLowerCase().includes(txt)) ||
                    (item.tecQualidade && item.tecQualidade.toLowerCase().includes(txt));
                
                return matchMod && matchSit && matchTxt;
            });

            document.getElementById('total-vistorias').textContent = filtrados.length;
            renderizarTabela(filtrados);
        };

        function renderizarTabela(lista) {
            const tbody = document.getElementById('tabela-vistorias');
            tbody.innerHTML = '';

            if (lista.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8">Nenhuma vistoria encontrada.</td></tr>';
                return;
            }

            lista.forEach((item, index) => {
                const badgeStatus = item.situacaoFinal === 'APROVADO' 
                    ? '<span class="badge badge-aprovado">Aprovado</span>' 
                    : '<span class="badge badge-reprovado">Pendência</span>';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.dataEnvio || '-'}</td>
                    <td><span class="badge badge-modulo">${item.modulo || 'CLIENTE'}</span></td>
                    <td><b>${item.tecQualidade || item.nomeUsuarioLogado || '-'}</b></td>
                    <td>${item.protocolo || '-'}</td>
                    <td>${item.cidade || '-'}/${item.estado || ''}</td>
                    <td>${item.tecExecutou || '-'}</td>
                    <td>${badgeStatus}</td>
                    <td>
                        <button style="padding:4px 8px; font-size:11px;" onclick="toggleDetalhes('${index}')">Ver Detalhes</button>
                    </td>
                `;

                const trDetalhes = document.createElement('tr');
                trDetalhes.id = `detalhe-${index}`;
                trDetalhes.className = 'hidden';
                
                let detalhesHTML = `<div class="detalhes-box">
                    <p><b>Empresa Executora:</b> ${item.empresa || 'N/A'} | <b>Tipo Vistoria:</b> ${item.tipoVistoria || 'N/A'}</p>
                    <p><b>Observações:</b> ${item.observacoes || 'Nenhuma'}</p>
                    <hr style="border:0; border-top:1px solid #cbd5e1;">
                    <b>Itens Avaliados:</b><ul>`;

                if (item.detalhesModulo) {
                    for (const [chave, valor] of Object.entries(item.detalhesModulo)) {
                        detalhesHTML += `<li><b>${chave}:</b> ${valor}</li>`;
                    }
                }
                detalhesHTML += `</ul></div>`;

                trDetalhes.innerHTML = `<td colspan="8">${detalhesHTML}</td>`;

                tbody.appendChild(tr);
                tbody.appendChild(trDetalhes);
            });
        }

        window.toggleDetalhes = function(index) {
            const el = document.getElementById(`detalhe-${index}`);
            if (el) {
                el.classList.toggle('hidden');
            }
        };
    </script>
</body>
</html>
